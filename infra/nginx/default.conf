server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # nginx's own default (1m) is far below query's configured upload limit
    # (settings.max_upload_size_mb, 500 by default — OMNI-205) and rejects
    # anything bigger before the request ever reaches query: no query log
    # line, just a 413 straight from nginx. Keep this at or above that
    # setting; a request nginx blocks is invisible to app-level logging.
    client_max_body_size 500m;

    # Every API call goes under /api/ — not because query wants that prefix
    # (it doesn't; /api/cameras is stripped back to /cameras below), but
    # because OMNI-208 needs a frontend *screen* at /cameras too, and a
    # resource path and a screen path can't both be bare /cameras. /api
    # keeps every future screen name free to match its resource name without
    # colliding, instead of special-casing collisions one at a time.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://query:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js dev mode needs this for its hot-reload WebSocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
