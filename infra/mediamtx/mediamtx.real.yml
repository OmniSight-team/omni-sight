# Camera simulator, realistic set (OMNI-509): the default.
#
# Twenty paths. cam01 to cam10 loop ten real surveillance clips, one each: three
# from VIRAT (1280x720, 23.97 fps, outdoor) and seven from UCF-Crime (320x240,
# 30 fps, fixed CCTV; four normal, three with an incident). cam11 to cam20 loop
# the same ten again, for the NFR-4 ladder beyond ten feeds. The synthetic test
# patterns of OMNI-201 are still in mediamtx.yml, as the worst case (they move all
# the time); choose them with MEDIAMTX_CONFIG=mediamtx.yml (docs/rtsp-simulator.md).
#
# The clips are re-encoded copies of files in data/, made by
# scripts/make_simulator_clips.py into infra/mediamtx/clips/real/ (gitignored,
# like everything under clips/): H.264, no audio, native size and frame rate, a
# keyframe every 2 s. Each loops with -stream_loop -1, so a camera sees its clip
# again every 7 to 37 s.
#
# addresses: rtsp://mediamtx:8554/cam01 ... cam20, inside the Docker network only.

paths:
  cam01:
    runOnInit: ffmpeg -re -stream_loop -1 -i /clips/real/real01_VIRAT_S_010003_07_000608_000636.mp4 -c copy -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
  cam02:
    runOnInit: ffmpeg -re -stream_loop -1 -i /clips/real/real02_VIRAT_S_010107_02_000282_000312.mp4 -c copy -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
