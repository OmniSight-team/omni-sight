# Broker settings for the segment queue (OMNI-311). Credentials are not here:
# they come from RABBITMQ_USER / RABBITMQ_PASSWORD in `.env`, through the
# RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS variables in docker-compose.yml.
#
# The queue and its messages are declared by the services themselves (see
# services/common/omnisight_common/segment_queue.py), not pre-defined here, so
# there is exactly one place that says what the queue looks like.

listeners.tcp.default = 5672

# The management UI (http://localhost:15672) — queue depth and unacknowledged
# counts are how "nothing was lost" is checked by eye during a failure test.
management.tcp.port = 15672

# A delivery a consumer holds without acknowledging for longer than this is
# treated as stuck: the channel is closed and the message goes back to the
# queue. The default is 30 minutes; spelled out here because it is the limit
# on how long one frame's database write may take before it is redelivered.
consumer_timeout = 1800000

log.console.level = warning
