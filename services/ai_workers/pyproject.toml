[project]
name = "omnisight-ai-workers"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "omnisight-common",
    "open-clip-torch>=3.3.0",
    "pillow>=12.3.0",
    "protobuf>=7.36.2",
    "sentencepiece>=0.2.2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.20.1",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false

[tool.uv.sources]
omnisight-common = { workspace = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
