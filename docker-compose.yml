services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  query:
    build:
      context: .
      dockerfile: services/query/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      INGESTION_BASE_URL: http://ingestion:8000
      RABBITMQ_HOST: rabbitmq
      QDRANT_HOST: qdrant
    ports:
      - "8000:8000"
    volumes:
      - ./services/common:/workspace/services/common
      - ./services/query:/workspace/services/query
      # Uploaded video bytes land here, mounted into ingestion at the same
      # path (OMNI-205) so OMNI-206 can probe by path, never by re-sending
      # the file.
      - video_storage:/data/videos
      - frame_storage:/data/frames
      - thumb_storage:/data/thumbs
      # OMNI-503: each live camera's current frame, written by ingestion and
      # served from here with the token check (not by nginx, so K-3 does not grow).
      - preview_storage:/data/previews:ro
      # OMNI-608: the local dataset mirror, read-only. Dataset clips are read from here
      # and copied into video_storage by the same function as an upload.
      - ./data:/datasets:ro
      # D-26: which dataset clips are loaded (the hand-check sample, committed).
      - ./datasets/hand_check:/hand_check:ro
      # OMNI-702: the VIRAT demo sample (committed), the VIRAT clips loaded to search.
      - ./datasets/demo:/demo:ro
    depends_on:
      postgres:
        condition: service_healthy
      ingestion:
        condition: service_started
      qdrant:
        condition: service_healthy

  # No port published and no nginx route — nothing outside the Docker network
  # can reach this service. Query is the only caller.
  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_HOST: rabbitmq
    volumes:
      - ./services/common:/workspace/services/common
      - ./services/ingestion:/workspace/services/ingestion
      - video_storage:/data/videos
      - frame_storage:/data/frames
      - thumb_storage:/data/thumbs
      - preview_storage:/data/previews
    depends_on:
      rabbitmq:
        condition: service_healthy

  # OMNI-311: the durable queue between ingestion (publishes a gated frame) and
  # the consumer below (stores it, then acknowledges it). Credentials from
  # `.env`; config in infra/rabbitmq/. AMQP and the management UI are published
  # on localhost only.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    # Fixed on purpose: RabbitMQ keeps its data under a directory named after
    # the node, which defaults to the container's hostname — and a recreated
    # container gets a new one, which would silently start from an empty
    # broker and lose every queued message despite the volume below.
    hostname: omnisight-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6

  # OMNI-703: the vector store (Phase A §3.3). Holds `frame_vectors`, one point per
  # admitted frame, created by query at startup (omnisight_common.frame_vectors).
  # No port published: only services inside the Docker network reach it. Pinned
  # to the version `qdrant-client` in uv.lock was released with.
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    volumes:
      - ./infra/qdrant/production.yaml:/qdrant/config/production.yaml:ro
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image has no curl or wget; bash's /dev/tcp asks /readyz instead.
      test:
        [
          "CMD", "bash", "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  # OMNI-704: the only service with PyTorch and a model. SigLIP 2 (Algorithm 2's frame
  # encoder) on the CPU; query asks it to encode a search query (POST /encode/text).
  # No port published and no nginx route. The checkpoint lives in models/pretrained/
  # (never committed) and is downloaded there at the pinned revision if missing.
  ai-workers:
    build:
      context: .
      dockerfile: services/ai_workers/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FRAME_MODEL_DIR: /models/pretrained/siglip2-so400m-patch14-384
    volumes:
      - ./services/common:/workspace/services/common
      - ./services/ai_workers:/workspace/services/ai_workers
      # Frames are encoded from the stored full-frame JPEG (`frame_path`), read-only.
      - frame_storage:/data/frames:ro
      - ./models/pretrained:/models/pretrained
    healthcheck:
      test:
        [
          "CMD", "/workspace/.venv/bin/python", "-c",
          "import json,urllib.request,sys;sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8000/health'))['loaded'] else 1)"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      # Loading the checkpoint takes a while; a first start also downloads it.
      start_period: 600s

  # OMNI-311: reads segments off the queue and writes the rows. The query
  # image with a different command, so it can be killed and restarted without
  # touching the API — which is exactly what the acceptance test does to it.
  # Since OMNI-502 this one stores files' segments and applies camera status
  # and stats; `consumer-live` below stores live frames.
  consumer:
    build:
      context: .
      dockerfile: services/query/Dockerfile
    restart: unless-stopped
    command:
      [
        "uv", "run", "--package", "omnisight-query", "python", "-m", "app.consumer"
      ]
    working_dir: /workspace/services/query
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      CONSUMER_ROLE: files
    volumes:
      - ./services/common:/workspace/services/common
      - ./services/query:/workspace/services/query
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # OMNI-502: the same consumer for live cameras' frames only, from a queue of
  # their own (`omnisight.segments.live`), so a live frame never waits behind a
  # recording's burst of segments on the queue above. Same image, same code,
  # same guarantees (persistent messages, acknowledged after the commit); only
  # the role differs.
  consumer-live:
    build:
      context: .
      dockerfile: services/query/Dockerfile
    restart: unless-stopped
    command:
      [
        "uv", "run", "--package", "omnisight-query", "python", "-m", "app.consumer"
      ]
    working_dir: /workspace/services/query
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      CONSUMER_ROLE: live
    volumes:
      - ./services/common:/workspace/services/common
      - ./services/query:/workspace/services/query
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Looping RTSP feeds for local development (OMNI-201) — see
  # docs/rtsp-simulator.md. No port published: only ingestion, inside the
  # Docker network, ever needs to reach it. OMNI-509: by default twenty paths
  # over ten real surveillance clips (mediamtx.real.yml); set
  # MEDIAMTX_CONFIG=mediamtx.yml for OMNI-201's ten synthetic test patterns,
  # the worst case.
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    restart: unless-stopped
    volumes:
      - ./infra/mediamtx/${MEDIAMTX_CONFIG:-mediamtx.real.yml}:/mediamtx.yml:ro
      - ./infra/mediamtx/clips:/clips:ro

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      API_PROXY_ORIGIN: http://query:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - query

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      # OMNI-307: thumbnails, read-only, served straight off this volume by
      # the `location /thumbs/` block. Deliberately not frame_storage — only
      # the small thumbnails are reachable this way, never full frames.
      - thumb_storage:/data/thumbs:ro
      # OMNI-308: the player's <video> element, served the same way —
      # straight off this volume by `location /media/`, read-only.
      - video_storage:/data/videos:ro
    depends_on:
      - query
      - frontend

volumes:
  postgres_data:
  frontend_node_modules:
  video_storage:
  frame_storage:
  thumb_storage:
  # OMNI-503: one small JPEG per live camera, replaced in place, never accumulated.
  preview_storage:
  # OMNI-311: queued messages must outlive the container, not just a restart.
  rabbitmq_data:
  # OMNI-703: the vectors, which must outlive the container like the rows do.
  qdrant_data:
