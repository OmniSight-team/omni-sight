[project]
name = "omnisight-query"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.2",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "omnisight-common",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false

[tool.uv.sources]
omnisight-common = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
